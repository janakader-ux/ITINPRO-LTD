<svg xmlns="http://www.w3.org/2000/svg" width="520" height="480" viewBox="0 0 520 480" role="img" aria-labelledby="title desc"><title id="title">Scan the complete open passport</title><desc id="desc">Include the facing top page, entire photograph and data page, machine-readable lines and all four edges. Diagram only, no personal data.</desc><rect width="520" height="480" rx="12" fill="#f5f7fa"/><g fill="#14233e" font-family="Arial,sans-serif"><text x="260" y="32" text-anchor="middle" font-size="18" font-weight="bold">Include both pages and all four edges</text><rect x="95" y="55" width="330" height="165" rx="8" fill="#e0e8f0" stroke="#284464" stroke-width="3"/><text x="260" y="135" text-anchor="middle" font-size="20">Facing top page</text><rect x="95" y="220" width="330" height="190" rx="8" fill="#e9eff5" stroke="#284464" stroke-width="3"/><rect x="115" y="240" width="78" height="90" fill="#b6c7d8"/><text x="154" y="290" text-anchor="middle" font-size="14">Photo</text><text x="212" y="257" font-size="16">Complete data page</text><text x="212" y="290" font-size="13">All details readable</text><text x="212" y="318" font-size="13">No glare or cropping</text><rect x="114" y="356" width="290" height="35" fill="#cfdae5"/><text x="259" y="378" text-anchor="middle" font-size="13">Full machine-readable area</text><text x="260" y="449" text-anchor="middle" font-size="15">Preparation scan only — originals are verified later</text></g></svg>
