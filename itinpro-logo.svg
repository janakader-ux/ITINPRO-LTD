<svg xmlns="http://www.w3.org/2000/svg" width="1015" height="480" viewBox="0 0 1015 480" role="img" aria-labelledby="title desc">
  <title id="title">ITIN Pro passport stamp wordmark</title>
  <desc id="desc">A distinctive ITIN Pro logo using a passport stamp inspired approval mark and premium wordmark.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#135B9A"/>
      <stop offset=".5" stop-color="#0B2C55"/>
      <stop offset="1" stop-color="#071B31"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071B31" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1015" height="480" rx="30" fill="#FFFFFF"/>
  <g transform="translate(76 82)">
    <text x="0" y="168" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="148" font-weight="900" letter-spacing="-5" fill="#071B31">ITIN</text>
    <text x="270" y="168" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="148" font-weight="900" letter-spacing="-6" fill="#00A878">PRO</text>
    <g transform="translate(575 16) rotate(-3)" filter="url(#shadow)">
      <rect x="0" y="0" width="304" height="176" rx="26" fill="#FFFFFF" stroke="#C7A04B" stroke-width="11"/>
      <rect x="21" y="22" width="262" height="132" rx="18" fill="#F7FAFC" stroke="#0B2C55" stroke-width="5"/>
      <rect x="42" y="48" width="66" height="82" rx="11" fill="#FFFFFF" stroke="#C7A04B" stroke-width="4.5"/>
      <circle cx="75" cy="76" r="16" fill="#0B2C55" opacity=".9"/>
      <path d="M51 126c8-20 19-31 24-31s16 11 24 31" fill="#DFF8EF" stroke="#0B2C55" stroke-width="4"/>
      <path d="M127 56h110" stroke="#5B6675" stroke-width="7" stroke-linecap="round" opacity=".5"/>
      <path d="M127 85h86" stroke="#5B6675" stroke-width="7" stroke-linecap="round" opacity=".32"/>
      <text x="183" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="1.8" fill="#0B2C55">CAA</text>
      <text x="183" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.3" fill="#5B6675">VERIFIED</text>
      <path d="M219 104l24 24 51-66" fill="none" stroke="#00A878" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
