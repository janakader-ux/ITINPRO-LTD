    <text x="0" y="266" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="1.05" fill="#5B6675">CERTIFIED ACCEPTANCE AGENTS</text>
    <text x="0" y="305" font-family="Arial, Helvetica, sans-serif" font-size="20.5" fill="#0B2C55">ITIN, Form W-7, 1040, EIN and LLC formation support</text>
